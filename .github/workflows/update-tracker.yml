name: Update Diamond Report Tracker

on:
  schedule:
    # 14:07 UTC = ~9am CDT — grades the prior day and captures Diamond Report Pick/K
    # Props for today (neither needs a posted lineup), plus a first pass at Elite
    # Picks. Well before essentially all MLB first pitches. Offset a few minutes off
    # the hour on purpose — GitHub's own docs warn on-the-hour is the highest-congestion
    # time for scheduled workflows and can cause delays or silent skips; every run of
    # this workflow so far has been a manual workflow_dispatch, never an actual
    # `schedule` trigger, which is the exact symptom that warning describes.
    - cron: '7 14 * * *'
    # 20:13 UTC = ~3pm CDT — official MLB lineups are usually posted 1-4 hours before
    # first pitch, so most are still not up at the 9am run. This second pass re-tries
    # Elite Picks capture with real lineups now available for most of the evening
    # slate. DRP/K Props are already captured by the morning run and get skipped
    # (see the check-before-compute guard in captureToday), so this only adds newly
    # lineup-qualified Elite Picks — it never re-touches an already-locked pick.
    - cron: '13 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tracker updater
        env:
          # Optional — real sportsbook lines for K Props + market context for Elite
          # Picks. Set in Settings → Secrets and variables → Actions. Everything
          # falls back to the model-only line/analysis if this isn't set.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/update-tracker.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/tracker.json; then
            echo "No changes to data/tracker.json — nothing to commit."
            exit 0
          fi
          git config user.name "diamond-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tracker.json
          git commit -m "Update tracker: capture today's picks, grade prior day's results"
          git push
