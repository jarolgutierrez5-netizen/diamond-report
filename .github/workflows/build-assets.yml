name: Build minified assets

# This repo has no build step at deploy time (Cloudflare Workers/Netlify both serve
# the repo root as-is — see wrangler.jsonc). Instead, whenever app.js, nfl-wnba-
# props.js, or styles.css change, this regenerates the matching .min files — the
# ones index.html actually loads — and commits them back to the same branch, so PR
# previews and production both always serve an up-to-date minified build without
# needing a real build step on either hosting platform.
#
# nfl-wnba-props.js is the first slice extracted out of app.js during a file-size
# scoping pass (see that file's own header comment) — a plain classic script loaded
# via its own <script> tag right after app.min.js in index.html, sharing the same
# runtime global scope. It gets the exact same treatment as app.js below.
#
# app.js (and nfl-wnba-props.js) is real production JS (no eval/new Function, no
# reflection on function names, nothing depends on exact variable naming across
# scope boundaries), so terser's compress+mangle (-c -m) is safe here — verified
# with a full Playwright regression pass (every board's render path, no console/
# runtime errors) plus the existing targeted test suite, all green against the
# compressed+mangled output. -c -m is NOT passed --toplevel, so top-level (global-
# scope) function/variable names are left untouched — every onclick="someFn(...)"
# in index.html and every window.someFn = ... assignment keeps working; only names
# local to a function body or IIFE get shortened. This cuts the shipped bundle by
# roughly a quarter (559KB -> 428KB minified, ~150KB -> ~123KB gzipped) versus the
# previous comments/whitespace-only build.
#
# Local rebuilds MUST use this exact command (same terser version, same flags) —
# a mismatched local build previously caused this job to immediately re-commit a
# byte-different rebuild on top of every push that touched app.js, which is how
# this comment block came to exist in the first place.
#
# styles.css minification stays conservative (token-level only, no restructuring)
# — csso's restructuring pass has historically been the riskier one to enable for
# CSS (cascade-order-sensitive rule merging), and the JS side is where the real
# size win already lives.

on:
  push:
    paths:
      - 'app.js'
      - 'nfl-wnba-props.js'
      - 'styles.css'

permissions:
  contents: write

concurrency:
  group: build-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit window.* references (catches the exact regression class in scripts/audit-window-refs.mjs's header comment — a "dead code" cleanup once deleted a live function alongside a genuinely dead one, and every caller's existence-guard silently swallowed it instead of throwing)
        run: node scripts/audit-window-refs.mjs

      - name: Minify app.js (compress + mangle, non-toplevel — see comment above)
        run: npx --yes terser@5.49.0 app.js -c -m --comments false -o app.min.js

      - name: Minify nfl-wnba-props.js (compress + mangle, non-toplevel — see comment above)
        run: npx --yes terser@5.49.0 nfl-wnba-props.js -c -m --comments false -o nfl-wnba-props.min.js

      - name: Minify styles.css (safe token-level minification, no restructuring)
        run: npx --yes csso-cli@4.0.2 styles.css --no-restructure --comments none -o styles.min.css

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- app.min.js nfl-wnba-props.min.js styles.min.css; then
            echo "No changes to app.min.js/nfl-wnba-props.min.js/styles.min.css — nothing to commit."
            exit 0
          fi
          git config user.name "diamond-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.min.js nfl-wnba-props.min.js styles.min.css
          git commit -m "Rebuild app.min.js/nfl-wnba-props.min.js/styles.min.css from source"

          # The ref this ran on can move during this run -- most often on main, where
          # update-tracker.yml/sync-statcast.yml/etc push independently on their own
          # schedules (see update-tracker.yml's own push step for a confirmed live
          # instance of this exact race, run 31262562751, 2026-08-08), but the same
          # applies to any branch someone pushes to again mid-run. Unlike this repo's
          # other auto-commit workflows, this one runs on whatever ref triggered it
          # (github.ref_name), not always main, so the fetch/rebase target has to be
          # dynamic too. -X theirs is safe here for the same reason as the others:
          # app.min.js/styles.min.css are only ever written by this workflow, so a
          # rebase onto a newer version of the same ref is a no-op replay.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — ${{ github.ref_name }} moved during this run. Fetching and rebasing..."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase -X theirs "origin/${{ github.ref_name }}"; then
              echo "::error::Rebase onto origin/${{ github.ref_name }} failed even preferring our own side — aborting. This run's rebuild was NOT pushed."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "::error::Push still rejected after 5 attempts."
          exit 1
