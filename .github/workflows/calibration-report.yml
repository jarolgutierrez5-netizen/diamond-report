name: Weekly model calibration report

# Runs analyze-hr-matchups.mjs / analyze-k-matchups.mjs / analyze-drp-matchups.mjs
# (Game Projections, HR Threats, K Props -- the three markets actually offered on the
# site) against the graded picks already sitting in data/tracker.json
# and commits the combined output as data/calibration-report.md — a durable, versioned,
# always-current record of whether each market's real hit rate actually tracks its
# predicted confidence, without anyone needing to remember to run the scripts by hand.
# Pure local analysis (no network calls), so this is cheap and safe to run often; weekly
# is enough since a single day only adds a handful of newly-graded picks per market.
#
# Also runs tune-model-params.mjs first (see that file's own header for the safety
# rails) -- a bounded, logged, gated auto-tune of data/model-params.json. It only ever
# touches that one JSON data file, never this repo's source, and every check it makes
# (adjusted or not) is appended to data/model-tuning-log.json, so the report and the
# tuning log always land in the same commit as a matched pair: what the data showed,
# and what (if anything) was done about it.
#
# Then runs fit-hr-isotonic-calibration.mjs (see that file's own header) -- a weekly,
# unattended, cross-validated fit of an isotonic (monotonic step-function) residual
# correction for HR Threats, layered on top of tune-model-params.mjs's linear
# correction to fix non-monotonic miscalibration a straight line structurally can't.
# Only ever touches data/hr-isotonic-calibration.json, gated behind its own
# cross-validated Brier-score improvement bar, and logs every run (activated,
# refreshed, or skipped) to the same data/model-tuning-log.json.

on:
  schedule:
    # 15:22 UTC Monday = ~10:22am CDT — after update-tracker.yml's 14:07 UTC morning run
    # has graded the prior day, so the week's freshest results are included. Offset off
    # the hour on purpose, same reasoning as update-tracker.yml's own schedule comment.
    - cron: '22 15 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: calibration-report
  cancel-in-progress: false

jobs:
  calibration-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run model parameter auto-tune
        run: node scripts/tune-model-params.mjs

      - name: Run HR isotonic calibration fit
        run: node scripts/fit-hr-isotonic-calibration.mjs

      - name: Run calibration reports
        run: |
          {
            echo "# Model Calibration Report"
            echo
            echo "Generated $(date -u '+%Y-%m-%d %H:%M UTC') by the weekly calibration-report workflow."
            echo "Re-run any of these locally any time: \`node scripts/analyze-<name>-matchups.mjs\`."
            echo
            echo "## HR Threats"
            echo
            echo '```'
            node scripts/analyze-hr-matchups.mjs
            echo '```'
            echo
            echo "## K Props"
            echo
            echo '```'
            node scripts/analyze-k-matchups.mjs
            echo '```'
            echo
            echo "## Diamond Report Pick (game winner)"
            echo
            echo '```'
            node scripts/analyze-drp-matchups.mjs
            echo '```'
          } > data/calibration-report.md

      - name: Commit and push if changed
        run: |
          # See build-assets.yml's own comment on this same pattern: `git add` on a path
          # that doesn't exist is a hard error, not a no-op, so model-tuning-log.json
          # (which doesn't exist until the tuner's first-ever adjustment or skip) is
          # added conditionally rather than named directly.
          git add data/calibration-report.md data/model-params.json data/hr-isotonic-calibration.json
          [ -f data/model-tuning-log.json ] && git add data/model-tuning-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "diamond-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Weekly model calibration report + parameter/isotonic auto-tune check"

          # main can move during this run -- confirmed live on 2026-07-28 (run 30301535470):
          # this workflow's own concurrency group only serializes it against ITSELF, not
          # against update-tracker.yml (a different group, `update-tracker`), which pushes
          # to main up to 3x/day. That run's push was flat-out rejected ("fetch first")
          # with no retry, so the whole week's tuning check + calibration report was
          # silently discarded -- data/model-tuning-log.json went 5 days without a new
          # entry even though the underlying auto-tune logic ran fine every time.
          #
          # Same retry+rebase loop as sync-statcast.yml's own push step (see its comment
          # for the full rationale). -X theirs is even safer here than there: the files
          # this step ever touches (calibration-report.md, model-params.json,
          # hr-isotonic-calibration.json, model-tuning-log.json) share no overlap at all
          # with what update-tracker.yml/other workflows write, so a rebase onto a newer
          # main never actually hits a
          # real conflict -- it's a no-op fast-forward-style replay in practice, this
          # flag just guards the (currently unseen) case where the SAME workflow overlaps
          # itself, exactly like sync-statcast.yml's own precedent.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — main moved during this run. Fetching and rebasing..."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "::error::Rebase onto origin/main failed even preferring our own side — aborting. This run's data was NOT pushed."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "::error::Push still rejected after 5 attempts."
          exit 1
