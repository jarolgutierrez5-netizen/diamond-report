name: Sync Pitcher/Batter Pitch-Arsenal Data

on:
  schedule:
    # 13:04 UTC = ~8am CDT — before the update-tracker.yml morning run (14:07 UTC), so
    # today's Elite Picks/matchup pages have fresh pitch-arsenal data before first pitch.
    # Offset off the top of the hour on purpose — see the comment in update-tracker.yml.
    # This is the only trigger that runs the full sync (pitch-arsenal + hot-hitters +
    # zone/HR) — those two leaderboard pulls are whole-season aggregates that don't
    # meaningfully change hour to hour, so there's no reason to repeat them below.
    - cron: '4 13 * * *'
    # MLB's own probablePitcher field on the schedule API doesn't populate all at once
    # in the morning — it fills in through the day as rotations get confirmed, so a
    # pitcher starting a later game can be missing from the 13:04 run entirely (see the
    # Christian Scott case this caught). These five re-run just the zone/HR step — a
    # bounded ~15-30 requests against today's probable starters, not the two heavy
    # whole-league leaderboard pulls — to pick up newly-confirmed starters without
    # hammering Baseball Savant's public endpoint five extra times a day.
    - cron: '9 15 * * *'
    - cron: '9 17 * * *'
    - cron: '9 19 * * *'
    - cron: '9 21 * * *'
    - cron: '9 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-statcast
  cancel-in-progress: false

jobs:
  sync-statcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the 13:04 UTC morning run (or a manual workflow_dispatch) does the full
      # sync — the four intraday reruns skip straight to the zone/HR step below, since
      # data/pitcher-statcast.json from the morning run already exists for them to
      # merge into.
      - name: Run Statcast pitch-arsenal sync
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-pitcher-statcast.mjs

      - name: Run Statcast hot-hitters sync (batter Barrel% / Hard-Hit% / xwOBA)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-statcast-hot-hitters.mjs
        timeout-minutes: 5

      - name: Run fielding-defense sync (OAA / Arm Strength)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-fielding-defense.mjs
        continue-on-error: true
        timeout-minutes: 3

      - name: Run situational splits sync (Home/Away, RISP, recent-form trend)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-batter-splits.mjs
        continue-on-error: true
        timeout-minutes: 5

      - name: Run park-factors sync
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-park-factors.mjs
        continue-on-error: true
        timeout-minutes: 3

      - name: Run bullpen-fatigue sync (recent reliever pitch counts / back-to-back arms)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-bullpen-fatigue.mjs
        continue-on-error: true
        timeout-minutes: 5

      - name: Run per-pitch-type HR + Strike Zone sync for today's probable starters
        # Depends on data/pitcher-statcast.json already existing (either from the step
        # above on the morning run, or from a prior run earlier the same day). A failure
        # here shouldn't block the two steps above from being committed on the morning
        # run, so it's allowed to fail without red-Xing the whole run (see the commit
        # step below, which stages whatever exists).
        run: node scripts/sync-pitcher-zone-hr.mjs
        continue-on-error: true
        timeout-minutes: 8

      - name: Commit and push if changed
        run: |
          # git diff --quiet only detects changes to already-tracked files — it silently
          # ignores brand-new untracked files, which is exactly what these files are
          # on a repo's first-ever run. Stage first, then check the index against HEAD so
          # a genuinely new file is treated as a real change instead of "nothing to commit".
          #
          # `git add` on a path that doesn't exist on disk is a hard error (exit 128), not
          # a no-op — data/park-factors.json has never been successfully written yet (its
          # sync script's Savant endpoint attempts have all 404'd/returned HTML live), so
          # naming it directly here killed the ENTIRE commit step and silently dropped
          # every other real, successful update from that run (batted-ball direction,
          # recent-form trend, etc.). `git add --` on an existing-or-not glob does not
          # error the way naming a literal missing path does.
          git add data/pitcher-statcast.json data/batter-pitch-type-season.json data/statcast-hot-hitters.json
          [ -f data/park-factors.json ] && git add data/park-factors.json
          [ -f data/bullpen-fatigue.json ] && git add data/bullpen-fatigue.json
          if git diff --cached --quiet; then
            echo "No changes to sync — nothing to commit."
            exit 0
          fi
          git config user.name "diamond-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync real pitch-arsenal, hot-hitter, and zone/HR-by-pitch data from Baseball Savant"
          git push
