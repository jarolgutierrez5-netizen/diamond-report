name: Sync Pitcher/Batter Pitch-Arsenal Data

on:
  schedule:
    # 13:04 UTC = ~8am CDT — before the update-tracker.yml morning run (14:07 UTC), so
    # today's Elite Picks/matchup pages have fresh pitch-arsenal data before first pitch.
    # Offset off the top of the hour on purpose — see the comment in update-tracker.yml.
    # This is the only trigger that runs the full sync (pitch-arsenal + hot-hitters +
    # zone/HR) — those two leaderboard pulls are whole-season aggregates that don't
    # meaningfully change hour to hour, so there's no reason to repeat them below.
    - cron: '4 13 * * *'
    # MLB's own probablePitcher field on the schedule API doesn't populate all at once
    # in the morning — it fills in through the day as rotations get confirmed, so a
    # pitcher starting a later game can be missing from the 13:04 run entirely (see the
    # Christian Scott case this caught). These five re-run just the zone/HR step — a
    # bounded ~15-30 requests against today's probable starters, not the two heavy
    # whole-league leaderboard pulls — to pick up newly-confirmed starters without
    # hammering Baseball Savant's public endpoint five extra times a day.
    - cron: '9 15 * * *'
    - cron: '9 17 * * *'
    - cron: '9 19 * * *'
    - cron: '9 21 * * *'
    - cron: '9 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-statcast
  cancel-in-progress: false

jobs:
  sync-statcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the 13:04 UTC morning run (or a manual workflow_dispatch) does the full
      # sync — the four intraday reruns skip straight to the zone/HR step below, since
      # data/pitcher-statcast.json from the morning run already exists for them to
      # merge into.
      - name: Run Statcast pitch-arsenal sync
        # Now also pulls career (2015-present) pitch-arsenal data — ~12 more cheap
        # whole-league requests (not per-pitcher), hence the added timeout below.
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-pitcher-statcast.mjs
        timeout-minutes: 10

      - name: Run Statcast hot-hitters sync (batter Barrel% / Hard-Hit% / xwOBA)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-statcast-hot-hitters.mjs
        timeout-minutes: 5

      - name: Run fielding-defense sync (OAA / Arm Strength)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-fielding-defense.mjs
        continue-on-error: true
        timeout-minutes: 3

      - name: Run situational splits sync (Home/Away, RISP, recent-form trend)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-batter-splits.mjs
        continue-on-error: true
        timeout-minutes: 5

      # Depends on both data/batter-pitch-type-season.json (season pitch mix, from the
      # pitch-arsenal step above) and statcast-hot-hitters.json's recentOpsTrend (from
      # the situational-splits step just above) to know which batters are currently
      # cold — must run after both. Gated to the morning-only run like those two steps,
      # since the cold-batter population itself only refreshes once/day.
      - name: Run pitch-mix-faced trend sync for currently-cold batters
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-batter-pitch-mix-trend.mjs
        continue-on-error: true
        timeout-minutes: 10

      - name: Run park-factors sync
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-park-factors.mjs
        continue-on-error: true
        timeout-minutes: 3

      - name: Run bullpen-fatigue sync (recent reliever pitch counts / back-to-back arms)
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-bullpen-fatigue.mjs
        continue-on-error: true
        timeout-minutes: 5

      - name: Run per-pitch-type HR + Strike Zone sync for today's probable starters
        # Depends on data/pitcher-statcast.json already existing (either from the step
        # above on the morning run, or from a prior run earlier the same day). A failure
        # here shouldn't block the two steps above from being committed on the morning
        # run, so it's allowed to fail without red-Xing the whole run (see the commit
        # step below, which stages whatever exists).
        run: node scripts/sync-pitcher-zone-hr.mjs
        continue-on-error: true
        timeout-minutes: 8

      # Batter-side counterpart to the step above -- fills in real per-pitch-type HR
      # counts for batters (including real confirmed zeros), which the Pitcher Matchup
      # modal's Pitch Mix Advantage table otherwise has to estimate by redistributing a
      # batter's overall HR total by pitch usage share (flagged "est" in the UI). Scoped
      # to today's active-roster position players across every team playing today, not
      # the full ~600-player tracked universe -- meaningfully more requests than the
      # pitcher step's ~15-30 probable starters (roughly 250-400 depending on the day's
      # slate), so this is morning-only, not repeated on every intraday trigger like the
      # pitcher step above (a roster doesn't "fill in through the day" the way probable-
      # pitcher assignments do, so there's nothing to gain from re-running it).
      - name: Run per-pitch-type HR sync for today's active batters
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-batter-zone-hr.mjs
        continue-on-error: true
        timeout-minutes: 25

      # Same bounded per-probable-starter scope as the zone/HR step above (reuses its
      # todaysProbablePitcherIds/pitcherSearchURL), so it re-runs on every intraday
      # trigger too — a pitcher's last-3-starts velocity/usage/whiff trend doesn't
      # change once his starter slot is confirmed, but re-running costs nothing extra
      # and keeps this consistent with the zone/HR step it shares its pitcher list with.
      - name: Run rolling pitch metrics sync (velocity/usage/whiff trend, last 3 starts)
        run: node scripts/sync-pitcher-rolling.mjs
        continue-on-error: true
        timeout-minutes: 8

      # Exploratory signal, not yet wired into any live scoring path — see
      # scripts/sync-pitcher-2k-suppression.mjs's header for the full rationale.
      # Same bounded per-probable-starter scope as the two steps above, reusing
      # the same pitcherSearchURL/todaysProbablePitcherIds. Persisted purely so
      # its real distribution/sample sizes can be inspected on live data before
      # deciding whether it's worth adding to HR Probability.
      - name: Run 2-strike contact suppression sync (exploratory — not yet used in scoring)
        run: node scripts/sync-pitcher-2k-suppression.mjs
        continue-on-error: true
        timeout-minutes: 8

      # Gated to the main morning run only (was unconditional on all 6 daily
      # triggers — 2 calls/run x 6 runs/day = 12/day with no "already fetched
      # today" guard, unlike fetchOddsLookup's oddsLastFetchedDate pattern or
      # the Ballpark Pal comparison capture's per-game skip-check). Trades a
      # little intraday weather freshness for a 6x cut in real usage against
      # the API's 15,000/month quota — the DIY Open-Meteo weather model this
      # cross-checks against already refreshes correctly per game load, so a
      # once-daily Ballpark Pal snapshot is a fine tradeoff. Skips gracefully
      # if the secret isn't set (falls back to the DIY model only).
      #
      # Moved to run BEFORE the situational-true-probability step below (was
      # after it) — that step now falls back to this one's
      # data/ballparkpal-hr-factors.json (today's per-hitter list) when MLB's own
      # boxscore.batters hasn't posted a confirmed lineup yet. Steps in the same
      # job share one checkout, so running this first means even the FIRST run of
      # the day can use same-run fresh data instead of whatever was left over from
      # yesterday's last commit.
      - name: Run Ballpark Pal weather/park-factor sync
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        env:
          BALLPARKPAL_API_KEY: ${{ secrets.BALLPARKPAL_API_KEY }}
        run: node scripts/sync-ballparkpal.mjs
        continue-on-error: true
        timeout-minutes: 3

      # Depends on data/pitcher-rolling.json from the rolling-metrics step above
      # (opposing pitcher power tier) and data/statcast-hot-hitters.json (the
      # tracked batter pool). No `if:` gate — unlike the near-HR step below, this
      # needs today's CONFIRMED STARTING LINEUPS, which post far later than
      # probable pitchers do, so re-running on every intraday trigger is what
      # actually lets this fill in through the day rather than staying empty from
      # a too-early morning run. Falls back to the Ballpark Pal step above's
      # per-hitter list (intersected with each team's active roster) when MLB's
      # own boxscore.batters hasn't posted yet.
      - name: Run situational true-probability sync (HR/Hits/TB, batter's own history vs today's matchup)
        run: node scripts/sync-batter-situational-props.mjs
        continue-on-error: true
        timeout-minutes: 20

      # Depends on data/statcast-hot-hitters.json already existing (the batter pool
      # this scopes to). Morning-run only, like the other batter-pool steps — this
      # walks the whole ~250-player tracked pool at a polite per-request delay, so it
      # takes meaningfully longer than the bounded probable-starters step above.
      # Also writes data/recent-hrs.json (confirmed HRs, not just near-misses) off
      # the exact same per-batter CSV fetch, and does a video-link resolution pass
      # for both via a per-game Baseball Savant feed (baseballsavant.mlb.com/gf) —
      # bumped from 20 to 25 minutes to give that extra ~1 request-per-unique-game
      # pass (cached across batters sharing a game) room to finish.
      - name: Run near-HR (warning-track fly-out) + confirmed-HR sync for tracked batters
        if: github.event.schedule == '4 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/sync-near-hrs.mjs
        continue-on-error: true
        timeout-minutes: 25

      - name: Commit and push if changed
        run: |
          # git diff --quiet only detects changes to already-tracked files — it silently
          # ignores brand-new untracked files, which is exactly what these files are
          # on a repo's first-ever run. Stage first, then check the index against HEAD so
          # a genuinely new file is treated as a real change instead of "nothing to commit".
          #
          # `git add` on a path that doesn't exist on disk is a hard error (exit 128), not
          # a no-op — data/park-factors.json has never been successfully written yet (its
          # sync script's Savant endpoint attempts have all 404'd/returned HTML live), so
          # naming it directly here killed the ENTIRE commit step and silently dropped
          # every other real, successful update from that run (batted-ball direction,
          # recent-form trend, etc.). `git add --` on an existing-or-not glob does not
          # error the way naming a literal missing path does.
          git add data/pitcher-statcast.json data/batter-pitch-type-season.json data/statcast-hot-hitters.json
          [ -f data/park-factors.json ] && git add data/park-factors.json
          [ -f data/bullpen-fatigue.json ] && git add data/bullpen-fatigue.json
          [ -f data/ballparkpal-hr-factors.json ] && git add data/ballparkpal-hr-factors.json
          [ -f data/ballparkpal-game-factors.json ] && git add data/ballparkpal-game-factors.json
          [ -f data/injury-history.json ] && git add data/injury-history.json
          [ -f data/near-hrs.json ] && git add data/near-hrs.json
          [ -f data/recent-hrs.json ] && git add data/recent-hrs.json
          [ -f data/batter-hr-spray.json ] && git add data/batter-hr-spray.json
          [ -f data/pitcher-rolling.json ] && git add data/pitcher-rolling.json
          [ -f data/pitcher-2k-suppression.json ] && git add data/pitcher-2k-suppression.json
          [ -f data/batter-situational-props.json ] && git add data/batter-situational-props.json
          [ -f data/prop-market-odds.json ] && git add data/prop-market-odds.json
          if git diff --cached --quiet; then
            echo "No changes to sync — nothing to commit."
            exit 0
          fi
          git config user.name "diamond-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync real pitch-arsenal, hot-hitter, and zone/HR-by-pitch data from Baseball Savant"

          # main can move during this ~30-40min run (a PR merging mid-run, OR another
          # run of this exact workflow overlapping it -- a manual workflow_dispatch and
          # a scheduled intraday rerun landed close enough together on 2026-07-25 that
          # the concurrency group's queueing didn't fully prevent overlap, and both
          # independently recomputed pitcher-statcast.json/pitcher-rolling.json/
          # pitcher-2k-suppression.json with genuinely different content -- a real
          # rebase conflict, not just a race, since this job is NOT always the only
          # writer in practice like previously assumed here).
          #
          # -X theirs resolves any such conflict by keeping OUR side -- note git's
          # rebase --ours/--theirs naming is notoriously backwards from merge: during a
          # rebase, "theirs" means the commit being replayed (this run's own freshly
          # computed data), and "ours" means the target we're rebasing onto (origin/
          # main). Safe here specifically because every file this step ever stages is a
          # complete, self-contained snapshot fully recomputed from a live API pull each
          # run, never an incremental/partial update -- there's no real merge to do
          # between two competing full snapshots, and the fresher one (this run's) is
          # always the one we want to keep, not a line-based Frankenstein of both.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — main moved during this run. Fetching and rebasing..."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "::error::Rebase onto origin/main failed even preferring our own side — aborting. This run's data was NOT pushed."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "::error::Push still rejected after 5 attempts."
          exit 1
