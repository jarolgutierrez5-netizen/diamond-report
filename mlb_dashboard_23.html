<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Report – MLB Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #e63946;
    --accent2: #f4a261;
    --green: #2ecc71;
    --text: #e8eaf0;
    --muted: #6b7a99;
    --live: #ff4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  .date-badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); background: var(--bg); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); }

  .nav { display: flex; gap: 2px; padding: 12px 24px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 18px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--live); margin-bottom: 14px; }
  .live-dot { width: 7px; height: 7px; background: var(--live); border-radius: 50%; animation: pulse 1s infinite; }

  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .game-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; position: relative; overflow: hidden; }
  .game-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .game-card.live::before { background: var(--live); }
  .game-card.closed::before { background: var(--border); }
  .game-card.scheduled::before { background: var(--accent2); }
  .game-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  .game-status.live { color: var(--live); }
  .game-status.closed { color: var(--muted); }
  .game-status.scheduled { color: var(--accent2); }
  .matchup { display: flex; align-items: center; justify-content: space-between; }
  .team-block { text-align: center; flex: 1; }
  .team-abbr { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; }
  .team-name { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .score-block { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; }
  .score-sep { color: var(--border); font-size: 20px; }
  .score-win { color: var(--green); }
  .score-loss { color: var(--muted); }
  .game-time { font-size: 10px; color: var(--muted); text-align: center; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }

  .standings-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .s-tab { padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 20px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--muted); transition: all .2s; }
  .s-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .s-tab:hover:not(.active) { color: var(--text); }

  .division-block { margin-bottom: 24px; }
  .division-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 6px 8px; text-align: left; }
  thead th:not(:first-child) { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: var(--surface2); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 9px 8px; font-size: 13px; }
  td:not(:first-child) { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .rank-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-right: 8px; width: 14px; display: inline-block; text-align: right; }
  .team-pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; background: var(--bg); border-radius: 3px; margin-right: 6px; color: var(--accent2); letter-spacing: .5px; border: 1px solid var(--border); }
  .win-bar { display: inline-block; height: 3px; background: var(--accent); border-radius: 2px; margin-left: 6px; vertical-align: middle; opacity: .5; }
  .pct-good { color: var(--green); }
  .pct-ok { color: var(--text); }
  .pct-bad { color: var(--muted); }

  .era-good { color: var(--green); }
  .era-ok { color: var(--text); }
  .era-bad { color: var(--accent); }
  .tbd-pill { font-size: 11px; color: var(--muted); font-style: italic; }

  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; margin-bottom: 16px; color: var(--text); }
  .section-title span { color: var(--accent); }

  /* Pitcher Report Table */
  .pr-table { width: 100%; border-collapse: collapse; }
  .pr-table thead th { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; text-align: center; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
  .pr-table thead th:first-child, .pr-table thead th:nth-child(2), .pr-table thead th:nth-child(3) { text-align: left; }
  .pr-table thead th:first-child { min-width: 80px; }
  .pr-table thead th:nth-child(2) { min-width: 210px; }
  .pr-table thead th.sort-asc::after { content: ' ▲'; color: var(--accent); }
  .pr-table thead th.sort-desc::after { content: ' ▼'; color: var(--accent); }
  .pr-table thead th:hover { color: var(--text); }
  .pr-table tbody tr.pr-main-row { border-bottom: 1px solid var(--border); transition: background .1s; }
  .pr-table tbody tr.pr-main-row:hover { background: var(--surface2); }
  .pr-table tbody tr.pr-expand-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .pr-table tbody td { padding: 11px 10px; vertical-align: middle; text-align: center; white-space: nowrap; }
  .pr-table tbody td:first-child, .pr-table tbody td:nth-child(2), .pr-table tbody td:nth-child(3) { text-align: left; }
  .pr-time { font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .pr-pitcher-cell { display: flex; align-items: center; gap: 10px; }
  .pr-headshot { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
  .pr-pitcher-info { display: flex; flex-direction: column; gap: 3px; }
  .pr-pitcher-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .pr-pitcher-sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pr-wl { font-size: 10px; color: var(--muted); }
  .btn-lineup { background: var(--surface2); border: 1px solid var(--border); color: var(--accent2); font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 3px 7px; border-radius: 4px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
  .btn-lineup:hover, .btn-lineup.active { border-color: var(--accent2); background: #1a1800; }
  .btn-game { display: inline-flex; align-items: center; gap: 4px; background: var(--surface2); border: 1px solid var(--border); color: #4a9eff; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px; text-decoration: none; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
  .btn-game:hover { border-color: #4a9eff; }
  .stat-pill { display: inline-block; padding: 4px 8px; border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; min-width: 52px; text-align: center; }
  .pill-green { background: #1a3a2a; color: #2ecc71; }
  .pill-red   { background: #3a1a1a; color: #e63946; }
  .pill-neu   { background: var(--surface2); color: var(--text); }
  .pr-plain   { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); }
  .mu-empty { color: var(--muted); font-size: 12px; padding: 12px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Lineup expand panel */
  .pr-expand-panel { padding: 16px 20px 20px; background: #080d17; }
  .lineup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .lineup-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .lineup-table { width: 100%; border-collapse: collapse; }
  .lineup-table th { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  .lineup-table th.r { text-align: right; }
  .lineup-table td { padding: 8px 8px; font-size: 12px; border-bottom: 1px solid #0f1826; vertical-align: middle; }
  .lineup-table td.r { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .lineup-table tr:last-child td { border-bottom: none; }
  .batter-name-cell { display: flex; align-items: center; gap: 8px; }
  .batter-pos { font-size: 9px; color: var(--muted); background: var(--surface2); padding: 1px 5px; border-radius: 3px; }
  .batter-num { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; min-width: 14px; }
  .hr-prob-cell { display: flex; align-items: center; gap: 8px; }
  .hr-bar-wrap { width: 70px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .hr-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .hr-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 36px; text-align: right; }
  .top-hr-badge { background: #2a1800; color: var(--accent2); font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px; letter-spacing: .5px; }
  .btn-matchup { background: #1a1a2e; border: 1px solid #6c63ff; color: #a78bfa; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: .3px; transition: all .15s; white-space: nowrap; }
  .btn-matchup:hover { border-color: #a78bfa; background: #252565; color: #fff; }

  /* Matchup Modal */
  .mu-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .mu-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto; position: relative; }
  .mu-modal-head { padding: 18px 20px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; position: sticky; top: 0; z-index: 10; border-radius: 12px 12px 0 0; }
  .mu-modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--text); }
  .mu-modal-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .mu-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .mu-close:hover { color: var(--text); }
  .mu-modal-body { padding: 20px; }

  /* H2H stats bar */
  .h2h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .h2h-stat { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; text-align: center; }
  .h2h-val { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; }
  .h2h-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  /* Strike zone */
  .zone-section { margin-bottom: 20px; }
  .zone-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .zone-wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .zone-grid-outer { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .zone-label { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .strike-zone { border: 2px solid var(--accent2); border-radius: 2px; display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; padding: 2px; background: #0a0e1a; width: 144px; }
  .sz-cell { width: 44px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; cursor: default; position: relative; transition: transform .1s; }
  .sz-cell:hover { transform: scale(1.05); z-index: 2; }
  .zone-legend { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; }
  .zone-leg-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .zone-leg-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .zone-note { font-size: 10px; color: var(--muted); line-height: 1.5; margin-top: 8px; }

  /* Pitch breakdown */
  .pitch-section { margin-bottom: 16px; }
  .pitch-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .pitch-name { font-size: 11px; color: var(--text); min-width: 110px; }
  .pitch-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .pitch-bar-fill { height: 100%; border-radius: 4px; }
  .pitch-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); min-width: 36px; text-align: right; }
  .pitch-ba { font-family: 'JetBrains Mono', monospace; font-size: 11px; min-width: 36px; text-align: right; }

  /* Vulnerability summary */
  .vuln-box { background: #0d1322; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .vuln-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
  .vuln-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; font-size: 12px; line-height: 1.5; }
  .vuln-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo"><div class="logo-dot"></div>DIAMOND REPORT</div>
  <div class="date-badge">SAT · JUN 27, 2026</div>
</header>

<nav class="nav">
  <div class="tab active" onclick="showTab('scores', this)">Live Scores</div>
  <div class="tab" onclick="showTab('standings', this)">Standings</div>
  <div class="tab" onclick="showTab('matchups', this)">Pitcher Report</div>
  <div class="tab" onclick="showTab('schedule', this)">Schedule</div>
</nav>

<main>
  <section class="section active" id="scores">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <p class="section-title" style="margin-bottom:0">TODAY'S <span>GAMES</span></p>
      <div id="scores-refresh" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">Loading…</div>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE NOW</div>
    <div class="games-grid" id="live-games"><div style="color:var(--muted);font-size:13px">Loading scores…</div></div>
    <p class="section-title" style="font-size:18px; margin-top:4px;">FINAL <span>SCORES</span></p>
    <div class="games-grid" id="final-games"></div>
  </section>

  <section class="section" id="standings">
    <p class="section-title">MLB <span>STANDINGS</span> · 2026</p>
    <div class="standings-tabs">
      <div class="s-tab active" onclick="showLeague('AL', this)">American League</div>
      <div class="s-tab" onclick="showLeague('NL', this)">National League</div>
    </div>
    <div id="standings-content"></div>
  </section>


  <section class="section" id="matchups">
    <p class="section-title">PITCHER <span>REPORT</span></p>
    <div id="pr-content"><div class="mu-empty"><span class="spin"></span>Loading today's pitchers…</div></div>
  </section>

  <section class="section" id="schedule">
    <p class="section-title">UPCOMING <span>GAMES</span></p>
    <div class="games-grid" id="scheduled-games"></div>
  </section>
</main>

<!-- Batter vs Pitcher Matchup Modal -->
<div id="mu-modal-overlay" class="mu-modal-overlay" style="display:none" onclick="if(event.target===this)closeMatchup()">
  <div class="mu-modal">
    <div class="mu-modal-head">
      <div>
        <div class="mu-modal-title" id="mu-modal-title">BATTER VS PITCHER</div>
        <div class="mu-modal-sub" id="mu-modal-sub"></div>
      </div>
      <button class="mu-close" onclick="closeMatchup()">✕</button>
    </div>
    <div class="mu-modal-body" id="mu-modal-body">
      <span class="spin"></span> Loading matchup data…
    </div>
  </div>
</div>

<script>
const standings = [
  {abbr:"TB",name:"Tampa Bay Rays",W:47,L:33,conf:"AL",div:"East"},
  {abbr:"NYY",name:"New York Yankees",W:48,L:34,conf:"AL",div:"East"},
  {abbr:"TOR",name:"Toronto Blue Jays",W:39,L:44,conf:"AL",div:"East"},
  {abbr:"BAL",name:"Baltimore Orioles",W:39,L:44,conf:"AL",div:"East"},
  {abbr:"BOS",name:"Boston Red Sox",W:35,L:46,conf:"AL",div:"East"},
  {abbr:"CWS",name:"Chicago White Sox",W:43,L:38,conf:"AL",div:"Central"},
  {abbr:"CLE",name:"Cleveland Guardians",W:42,L:40,conf:"AL",div:"Central"},
  {abbr:"MIN",name:"Minnesota Twins",W:39,L:44,conf:"AL",div:"Central"},
  {abbr:"DET",name:"Detroit Tigers",W:35,L:48,conf:"AL",div:"Central"},
  {abbr:"KC",name:"Kansas City Royals",W:34,L:50,conf:"AL",div:"Central"},
  {abbr:"SEA",name:"Seattle Mariners",W:42,L:41,conf:"AL",div:"West"},
  {abbr:"TEX",name:"Texas Rangers",W:41,L:42,conf:"AL",div:"West"},
  {abbr:"ATH",name:"Athletics",W:40,L:42,conf:"AL",div:"West"},
  {abbr:"HOU",name:"Houston Astros",W:41,L:44,conf:"AL",div:"West"},
  {abbr:"LAA",name:"Los Angeles Angels",W:34,L:49,conf:"AL",div:"West"},
  {abbr:"MIL",name:"Milwaukee Brewers",W:50,L:29,conf:"NL",div:"Central"},
  {abbr:"CHC",name:"Chicago Cubs",W:44,L:38,conf:"NL",div:"Central"},
  {abbr:"STL",name:"St. Louis Cardinals",W:42,L:37,conf:"NL",div:"Central"},
  {abbr:"PIT",name:"Pittsburgh Pirates",W:41,L:42,conf:"NL",div:"Central"},
  {abbr:"CIN",name:"Cincinnati Reds",W:39,L:42,conf:"NL",div:"Central"},
  {abbr:"ATL",name:"Atlanta Braves",W:49,L:31,conf:"NL",div:"East"},
  {abbr:"PHI",name:"Philadelphia Phillies",W:46,L:37,conf:"NL",div:"East"},
  {abbr:"MIA",name:"Miami Marlins",W:43,L:39,conf:"NL",div:"East"},
  {abbr:"WSH",name:"Washington Nationals",W:41,L:42,conf:"NL",div:"East"},
  {abbr:"NYM",name:"New York Mets",W:35,L:48,conf:"NL",div:"East"},
  {abbr:"LAD",name:"Los Angeles Dodgers",W:52,L:30,conf:"NL",div:"West"},
  {abbr:"SD",name:"San Diego Padres",W:43,L:37,conf:"NL",div:"West"},
  {abbr:"AZ",name:"Arizona Diamondbacks",W:41,L:41,conf:"NL",div:"West"},
  {abbr:"SF",name:"San Francisco Giants",W:33,L:48,conf:"NL",div:"West"},
  {abbr:"COL",name:"Colorado Rockies",W:32,L:50,conf:"NL",div:"West"}
];

function gameCard(g) {
  const { awayAbbr, homeAbbr, awayName, homeName, awayScore, homeScore, inning, status, time } = g;
  const isLive = status === 'live';
  const isFinal = status === 'final';
  const cls = isLive ? 'live' : isFinal ? 'closed' : 'scheduled';
  const label = isLive ? (inning || 'LIVE') : isFinal ? 'FINAL' : 'UPCOMING';

  let scoreHTML = '';
  if (awayScore !== null && homeScore !== null) {
    const awayW = awayScore > homeScore;
    const homeW = homeScore > awayScore;
    scoreHTML = `<div class="score-block">
      <span class="${awayW?'score-win':'score-loss'}">${awayScore}</span>
      <span class="score-sep">–</span>
      <span class="${homeW?'score-win':'score-loss'}">${homeScore}</span>
    </div>`;
  } else {
    scoreHTML = `<div style="font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--accent2);padding:0 8px">VS</div>`;
  }
  return `<div class="game-card ${cls}">
    <div class="game-status ${cls}">${label}</div>
    <div class="matchup">
      <div class="team-block"><div class="team-abbr">${awayAbbr}</div><div class="team-name">${awayName}</div></div>

      <div class="team-block"><div class="team-abbr">${homeAbbr}</div><div class="team-name">${homeName}</div></div>
    </div>
    <div class="game-time">${time}</div>
  </div>`;
}

async function loadScores() {
  // Use local date in America/Chicago timezone to avoid UTC date mismatch
  const today = new Date().toLocaleDateString('en-CA', {timeZone: 'America/Chicago'}); // YYYY-MM-DD
  const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today}&hydrate=linescore,team&language=en`;
  try {
    const res = await fetch(url);
    const data = await res.json();

    // API returns dates array — find today's entry
    const dateEntry = data.dates?.find(d => d.date === today) || data.dates?.[0];
    const games = dateEntry?.games || [];

    const live = [], final = [], upcoming = [];

    games.forEach(g => {
      const away = g.teams.away;
      const home = g.teams.home;
      const state = g.status.abstractGameState; // 'Preview', 'Live', 'Final'
      const detailedState = g.status.detailedState; // 'In Progress', 'Final', 'Scheduled', etc.
      const dt = new Date(g.gameDate);
      const timeStr = dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:'America/Chicago'}) + ' CDT';
      const linescore = g.linescore || {};
      const inningStr = linescore.currentInning
        ? `${linescore.inningHalf === 'Bottom' ? '▼' : '▲'} ${linescore.currentInning}`
        : detailedState === 'In Progress' ? 'LIVE' : null;

      const isLive = state === 'Live' || detailedState === 'In Progress' || detailedState === 'Warmup';
      const isFinal = state === 'Final' || detailedState === 'Final' || detailedState === 'Game Over';

      const card = {
        awayAbbr: away.team.abbreviation,
        homeAbbr: home.team.abbreviation,
        awayName: away.team.shortName || away.team.teamName,
        homeName: home.team.shortName || home.team.teamName,
        awayScore: away.score ?? null,
        homeScore: home.score ?? null,
        inning: inningStr,
        time: timeStr,
        status: isLive ? 'live' : isFinal ? 'final' : 'upcoming'
      };

      if (isLive) live.push(card);
      else if (isFinal) final.push(card);
      else upcoming.push(card);
    });

    document.getElementById('live-games').innerHTML = live.length
      ? live.map(gameCard).join('')
      : '<div style="color:var(--muted);font-size:13px;padding:4px 0">No live games right now.</div>';

    document.getElementById('final-games').innerHTML = final.length
      ? final.map(gameCard).join('')
      : '<div style="color:var(--muted);font-size:13px;padding:4px 0">No final games yet today.</div>';

    document.getElementById('scheduled-games').innerHTML = upcoming.map(upcomingCard).join('');

    const now = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
    document.getElementById('scores-refresh').textContent = `Updated ${now} · auto-refreshes every 30s`;
  } catch(e) {
    document.getElementById('scores-refresh').textContent = `Error: ${e.message}`;
    document.getElementById('live-games').innerHTML = `<div style="color:var(--accent);font-size:12px">Failed to load scores: ${e.message}</div>`;
  }
}

function buildStandings(conf) {
  const divOrder = ['East','Central','West'];
  let html = '';
  divOrder.forEach(div => {
    const teams = standings.filter(t => t.conf === conf && t.div === div)
      .sort((a,b) => (b.W/(b.W+b.L)) - (a.W/(a.W+a.L)));
    if (!teams.length) return;
    const ldr = teams[0];
    html += `<div class="division-block">
      <div class="division-label">${conf === 'AL' ? 'American' : 'National'} League · ${div}</div>
      <table><thead><tr>
        <th style="width:220px">Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th>
      </tr></thead><tbody>`;
    teams.forEach((t, i) => {
      const pct = t.W/(t.W+t.L);
      const pctStr = pct.toFixed(3).replace('0.','.').replace('1.000','1.000');
      const pctCls = pct >= .560 ? 'pct-good' : pct >= .470 ? 'pct-ok' : 'pct-bad';
      const gb = i === 0 ? '—' : (((ldr.W - t.W) + (t.L - ldr.L)) / 2).toFixed(1);
      const barW = Math.round(pct * 80);
      html += `<tr>
        <td><span class="rank-num">${i+1}</span><span class="team-pill">${t.abbr}</span>${t.name}<span class="win-bar" style="width:${barW}px"></span></td>
        <td>${t.W}</td><td>${t.L}</td>
        <td class="${pctCls}">${pctStr}</td>
        <td style="color:var(--muted)">${gb}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  return html;
}

async function loadPitcherReport() {
  const el = document.getElementById('pr-content');
  try {
    const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/Chicago'});
    const schedRes = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today}&hydrate=team,probablePitcher&language=en`);
    const schedData = await schedRes.json();
    const entry = schedData.dates?.find(d => d.date === today) || schedData.dates?.[0];
    const games = entry?.games || [];
    if (!games.length) { el.innerHTML = '<div class="mu-empty">No games scheduled today.</div>'; return; }

    const pitchers = [];
    games.forEach(g => {
      const dt = new Date(g.gameDate);
      const t = dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
      const state = g.status.abstractGameState;
      const isLive = state==='Live' || g.status.detailedState==='In Progress';
      const isFinal = state==='Final';
      const timeLabel = isLive ? '● LIVE' : isFinal ? 'FINAL' : t;
      const timeColor = isLive ? 'var(--live)' : isFinal ? 'var(--muted)' : 'var(--text)';
      const gameTimestamp = dt.getTime(); // numeric ms for sorting
      [['away','home'],['home','away']].forEach(([side,opp]) => {
        const p = g.teams[side].probablePitcher;
        if (p) pitchers.push({
          id: p.id, name: p.fullName,
          teamAbbr: g.teams[side].team.abbreviation,
          oppAbbr: g.teams[opp].team.abbreviation,
          oppTeamId: g.teams[opp].team.id,
          timeLabel, timeColor, gameTimestamp,
          gamePk: g.gamePk,
          side,
          mlbLink: `https://www.mlb.com/gameday/${g.gamePk}`
        });
      });
    });

    if (!pitchers.length) { el.innerHTML = '<div class="mu-empty">No probable pitchers announced yet.</div>'; return; }

    const statsArr = await Promise.all(pitchers.map(async p => {
      try {
        const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${p.id}?hydrate=stats(group=pitching,type=season,season=2026)`);
        const d = await r.json();
        return d.people?.[0]?.stats?.[0]?.splits?.[0]?.stat || {};
      } catch { return {}; }
    }));

    function f(v, dec=2) {
      if (v==null||v==='') return null;
      const n=parseFloat(v); return isNaN(n)?null:+n.toFixed(dec);
    }
    function fI(v) { const n=parseInt(v); return isNaN(n)?null:n; }

    prRows = pitchers.map((p, i) => {
      const s = statsArr[i];
      const iso = (s.slg!=null&&s.avg!=null) ? f(parseFloat(s.slg)-parseFloat(s.avg),3) : null;
      return {
        pitcher: p,
        gameTime: p.gameTimestamp, // numeric for sorting
        ip: f(s.inningsPitched,1), bf: fI(s.battersFaced),
        fip: f(s.fip), avg: f(s.avg,3), woba: f(s.obp,3),
        whip: f(s.whip), iso, slg: f(s.slg,3),
        hr: fI(s.homeRuns), hr9: f(s.homeRunsPer9), tb: fI(s.totalBases),
        wl: (s.wins!=null)?`${s.wins}-${s.losses}`:'–',
        era: f(s.era),
        rawHr9: parseFloat(s.homeRunsPer9) || 0,
        rawIp: parseFloat(s.inningsPitched) || 0,
      };
    });

    // Default sort by game time ascending
    prSortCol = 'gameTime';
    prSortDir = 1;

    renderPRTable();
  } catch(e) {
    document.getElementById('pr-content').innerHTML = `<div class="mu-empty" style="color:var(--accent)">Error: ${e.message}</div>`;
  }
}

function pill(val, dispFn, goodBelow, badAbove) {
  if (val==null) return `<span class="stat-pill pill-neu">–</span>`;
  const cls = val<=goodBelow ? 'pill-green' : val>=badAbove ? 'pill-red' : 'pill-neu';
  return `<span class="stat-pill ${cls}">${dispFn(val)}</span>`;
}

async function fetchAndRenderLineup(pitcherId, pitcherName, gamePk, side, oppTeamId, pitcherHr9, pitcherIp) {
  const panel = document.getElementById(`panel-${pitcherId}`);
  if (!panel) return;

  // Show a subtle refresh indicator if already has content, else full loader
  const hasContent = panel.querySelector('.batter-row-item');
  if (!hasContent) panel.innerHTML = `<div style="padding:12px 0;color:var(--muted);font-size:12px"><span class="spin"></span> Loading lineup…</div>`;

  try {
    const oppSide = side === 'away' ? 'home' : 'away';
    const boxRes = await fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`);
    const box = await boxRes.json();
    const teamBox = box.teams?.[oppSide];
    let batters = (teamBox?.batters || []).map(id => teamBox.players[`ID${id}`]).filter(Boolean);

    if (!batters.length) {
      const rosterRes = await fetch(`https://statsapi.mlb.com/api/v1/teams/${oppTeamId}/roster?rosterType=active&hydrate=stats(group=hitting,type=season,season=2026)`);
      const rosterData = await rosterRes.json();
      batters = (rosterData.roster || [])
        .filter(p => !['P','TWP'].includes(p.position?.abbreviation))
        .sort((a,b) => (b.stats?.[0]?.splits?.[0]?.stat?.atBats||0) - (a.stats?.[0]?.splits?.[0]?.stat?.atBats||0))
        .slice(0,9)
        .map(p => ({ person: p.person, position: p.position, seasonStats: { batting: p.stats?.[0]?.splits?.[0]?.stat||{} } }));
    }

    const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/Chicago'});

    const enriched = await Promise.all(batters.slice(0,9).map(async b => {
      const id = b.person?.id;
      if (!id) return { seasonStats: b.seasonStats?.batting || {}, last10HR: null, todayHR: 0 };
      try {
        const [seasonRes, logRes] = await Promise.all([
          fetch(`https://statsapi.mlb.com/api/v1/people/${id}?hydrate=stats(group=hitting,type=season,season=2026)`),
          fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=gameLog&group=hitting&season=2026&gameType=R`)
        ]);
        const seasonData = await seasonRes.json();
        const logData    = await logRes.json();
        const seasonStats = seasonData.people?.[0]?.stats?.[0]?.splits?.[0]?.stat || b.seasonStats?.batting || {};
        const gameLogs    = logData.stats?.[0]?.splits || [];
        const last10HR    = gameLogs.slice(0,10).reduce((sum, g) => sum + (parseInt(g.stat?.homeRuns)||0), 0);
        const todayLog    = gameLogs.find(g => g.date === today);
        const todayHR     = parseInt(todayLog?.stat?.homeRuns) || 0;
        const boxTodayHR  = parseInt(teamBox?.players?.[`ID${id}`]?.stats?.batting?.homeRuns) || 0;
        return { seasonStats, last10HR, todayHR: Math.max(todayHR, boxTodayHR) };
      } catch {
        return { seasonStats: b.seasonStats?.batting || {}, last10HR: null, todayHR: 0 };
      }
    }));

    const lineup = batters.slice(0,9).map((b, i) => ({
      name: b.person?.fullName || '–',
      id: b.person?.id,
      pos: b.position?.abbreviation || '–',
      stats: enriched[i].seasonStats,
      last10HR: enriched[i].last10HR,
      todayHR: enriched[i].todayHR,
    }));

    const cacheKey = `${gamePk}-${side}`;
    lineupCache[cacheKey] = { lineup, oppSide, teamAbbr: box.teams?.[oppSide]?.team?.abbreviation || '' };
    renderLineup(`panel-${pitcherId}`, lineupCache[cacheKey], pitcherHr9, pitcherIp, null, pitcherId, pitcherName);
  } catch(e) {
    if (panel) panel.innerHTML = `<div class="mu-empty" style="color:var(--accent)">Error loading lineup: ${e.message}</div>`;
  }
}

function renderLineup(panelId, data, pitcherHr9, pitcherIp, oppAbbr, pitcherId, pitcherName) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const { lineup, teamAbbr } = data;

  function hrProb(s) {
    const ab = parseInt(s.atBats) || 0;
    const hr = parseInt(s.homeRuns) || 0;
    const batterRate = ab > 0 ? hr / ab : 0;
    const pitcherRate = pitcherHr9 > 0 ? pitcherHr9 / 27 : 0.03;
    return Math.min(((batterRate * 0.6) + (pitcherRate * 0.4)) * 100, 25);
  }

  const withProbs = lineup.map(b => ({ ...b, hrProb: hrProb(b.stats) }));
  const maxProb = Math.max(...withProbs.map(b => b.hrProb), 0.01);
  const topIdx = withProbs.reduce((best, b, i) => b.hrProb > withProbs[best].hrProb ? i : best, 0);

  function fmtS(v, dec=3) {
    if (!v || v==='---') return '–';
    const n = parseFloat(v);
    return isNaN(n) ? '–' : n.toFixed(dec).replace(/^0/,'');
  }

  const cards = withProbs.map((b, i) => {
    const s = b.stats;
    const isTop = i === topIdx && !b.todayHR; // today HR badge takes priority
    const homerToday = b.todayHR > 0;
    const barPct = maxProb > 0 ? (b.hrProb / maxProb) * 100 : 0;
    const barColor = homerToday ? '#f4a261' : isTop ? '#f4a261' : b.hrProb > maxProb * 0.7 ? '#e63946' : '#2ecc71';
    const pName = (pitcherName||'').replace(/'/g,"\\'");
    const bName = b.name.replace(/'/g,"\\'");

    // Last 10 HR dots — filled circle per HR, empty per game without
    const last10HR = b.last10HR;
    const last10Display = last10HR === null
      ? '<span style="color:var(--muted);font-size:10px">–</span>'
      : `<span style="font-family:\'JetBrains Mono\',monospace;font-size:13px;font-weight:700;color:${last10HR>=3?'var(--accent2)':last10HR>=1?'#90ee60':'var(--muted)'}">${last10HR}</span>
         <span style="font-size:9px;color:var(--muted)">HR</span>`;

    // Row highlight if homered today
    const rowBg = homerToday
      ? 'background:linear-gradient(90deg,#2a1a00 0%,#1a1200 100%);border-left:3px solid var(--accent2);'
      : '';

    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0 10px ${homerToday?'8px':'11px'};border-bottom:1px solid var(--border);${rowBg}border-radius:${homerToday?'4px':'0'}">
      <span style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;min-width:14px">${i+1}</span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:700;color:${homerToday?'var(--accent2)':'var(--text)'}">${b.name}</span>
          <span class="batter-pos">${b.pos}</span>
          ${homerToday ? `<span style="background:#2a1500;color:#f4a261;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.5px;border:1px solid #f4a26166">💥 HR TODAY${b.todayHR>1?' x'+b.todayHR:''}</span>` : ''}
          ${isTop ? `<span class="top-hr-badge">⚡ TOP HR THREAT</span>` : ''}
        </div>
        <div style="display:flex;gap:12px;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);flex-wrap:wrap">
          <span>AVG <strong style="color:var(--text)">${fmtS(s.avg)}</strong></span>
          <span>HR <strong style="color:${parseInt(s.homeRuns)>=10?'var(--accent2)':'var(--text)'}">${s.homeRuns??'–'}</strong></span>
          <span>OPS <strong style="color:var(--text)">${fmtS(s.ops)}</strong></span>
          <span style="display:flex;align-items:center;gap:4px">L10 ${last10Display}</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <div>
          <div style="font-size:9px;color:var(--muted);letter-spacing:.5px;margin-bottom:3px;text-align:right">HR PROB/AB</div>
          <div class="hr-prob-cell">
            <div class="hr-bar-wrap"><div class="hr-bar-fill" style="width:${barPct.toFixed(0)}%;background:${barColor}"></div></div>
            <span class="hr-pct" style="color:${homerToday?'var(--accent2)':isTop?'var(--accent2)':'var(--muted)'}">${b.hrProb.toFixed(1)}%</span>
          </div>
        </div>
        <button class="btn-matchup" onclick="openMatchup(${b.id},'${bName}',${pitcherId},'${pName}')" title="Batter vs Pitcher analysis">
          ⚔ BATTER vs PITCHER
        </button>
      </div>
    </div>`;
  }).join('');

  const now = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  panel.innerHTML = `
    <div style="padding:4px 0 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
      <span style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)">
        ${teamAbbr || oppAbbr || ''} BATTING LINEUP
      </span>
      <div style="display:flex;gap:14px;align-items:center;font-size:10px;color:var(--muted)">
        <span><span style="color:var(--accent2)">💥 HR TODAY</span> = homered this game</span>
        <span><span style="color:#90ee60">L10</span> = HRs in last 10 games</span>
        <span>⚔ for matchup</span>
        <span style="font-family:'JetBrains Mono',monospace;color:var(--border)">updated ${now}</span>
      </div>
    </div>
    ${cards}`;
}

function sortPR(col) {
  if (prSortCol===col) prSortDir*=-1;
  else { prSortCol=col; prSortDir=1; }
  renderPRTable();
}


// ── BATTER VS PITCHER MATCHUP MODAL ──────────────────────────────────
function closeMatchup() {
  document.getElementById('mu-modal-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

async function openMatchup(batterId, batterName, pitcherId, pitcherName) {
  const overlay = document.getElementById('mu-modal-overlay');
  const body    = document.getElementById('mu-modal-body');
  const title   = document.getElementById('mu-modal-title');
  const sub     = document.getElementById('mu-modal-sub');

  title.textContent = `${batterName}  vs  ${pitcherName}`;
  sub.textContent   = 'Batter vs Pitcher · 2026 Season Analysis';
  body.innerHTML    = `<div style="padding:20px 0;text-align:center"><span class="spin"></span> Loading matchup data…</div>`;
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  try {
    // Parallel fetch: H2H career stats, batter season stats, pitcher season stats
    const [h2hRes, batterRes, pitcherRes] = await Promise.all([
      fetch(`https://statsapi.mlb.com/api/v1/people/${batterId}/stats?stats=vsPlayer&opposingPlayerId=${pitcherId}&group=hitting&season=2026`),
      fetch(`https://statsapi.mlb.com/api/v1/people/${batterId}?hydrate=stats(group=hitting,type=season,season=2026)`),
      fetch(`https://statsapi.mlb.com/api/v1/people/${pitcherId}?hydrate=stats(group=pitching,type=season,season=2026)`)
    ]);
    const h2hData     = await h2hRes.json();
    const batterData  = await batterRes.json();
    const pitcherData = await pitcherRes.json();

    const h2h = h2hData.stats?.[0]?.splits?.[0]?.stat || {};
    const bs  = batterData.people?.[0]?.stats?.[0]?.splits?.[0]?.stat || {};
    const ps  = pitcherData.people?.[0]?.stats?.[0]?.splits?.[0]?.stat || {};

    renderMatchupModal(body, { batterName, pitcherName, batterId, pitcherId, h2h, bs, ps });
  } catch(e) {
    body.innerHTML = `<div class="mu-empty" style="color:var(--accent)">Error: ${e.message}</div>`;
  }
}

function renderMatchupModal(body, { batterName, pitcherName, batterId, pitcherId, h2h, bs, ps }) {
  function fv(v, dec=3) {
    if (v==null||v===''||v==='---') return '–';
    const n = parseFloat(v); return isNaN(n) ? '–' : n.toFixed(dec).replace(/^0(\.)/, '$1');
  }
  function fi(v) { const n=parseInt(v); return isNaN(n)?'–':String(n); }

  // ── H2H Career block ──
  const h2hAB  = fi(h2h.atBats);
  const h2hAVG = fv(h2h.avg);
  const h2hHR  = fi(h2h.homeRuns);
  const h2hK   = fi(h2h.strikeOuts);
  const h2hOPS = fv(h2h.ops);
  const h2hHits = fi(h2h.hits);
  const hasH2H = h2hAB !== '–' && parseInt(h2h.atBats) > 0;

  // ── Season stats ──
  const bAVG  = fv(bs.avg);  const bHR = fi(bs.homeRuns); const bOPS = fv(bs.ops);
  const bISO  = (bs.slg&&bs.avg) ? fv((parseFloat(bs.slg)-parseFloat(bs.avg)).toFixed(3)) : '–';
  const bKpct = (bs.strikeOuts&&bs.plateAppearances) ? (bs.strikeOuts/bs.plateAppearances*100).toFixed(1)+'%' : '–';
  const bBBpct= (bs.baseOnBalls&&bs.plateAppearances) ? (bs.baseOnBalls/bs.plateAppearances*100).toFixed(1)+'%' : '–';

  const pERA  = fv(ps.era,2); const pFIP = fv(ps.fip,2); const pWHIP = fv(ps.whip,2);
  const pHR9  = fv(ps.homeRunsPer9,2); const pKper9 = fv(ps.strikeoutsPer9Inn,1);
  const pAVG  = fv(ps.avg); const pISO = (ps.slg&&ps.avg) ? fv((parseFloat(ps.slg)-parseFloat(ps.avg)).toFixed(3)) : '–';

  // ── Strike zone vulnerability model ──
  // We model a 3×3 strike zone (9 cells) and assign heat values based on:
  // - Pitcher's overall avg/slg allowed → drives base vulnerability
  // - Hand matchup patterns (generic tendencies)
  // - If H2H data exists, skew toward those zones
  // Values 0–1 representing batter's opportunity in each zone
  const pitcherVuln = parseFloat(ps.slg)||.350;
  const pitcherAvgA = parseFloat(ps.avg)||.240;
  const batterPow   = parseInt(bs.homeRuns)||0;

  // Generic zone vulnerability: pitchers tend to allow more damage middle/low zones
  // Higher = more opportunity for batter
  // [TL, TM, TR, ML, MM, MR, BL, BM, BR]
  const baseZone = [0.35, 0.55, 0.35, 0.60, 0.80, 0.60, 0.40, 0.45, 0.40];
  // Scale by pitcher's allowed slg (higher slg = more vulnerable everywhere)
  const vulnScale = Math.min(pitcherVuln / 0.380, 1.6);
  // Power hitters do more damage up in zone
  const powerBias = Math.min(batterPow / 25, 0.3);
  const zoneVals = baseZone.map((z, i) => {
    let v = z * vulnScale;
    if (i < 3) v += powerBias; // top row boost for power
    if (h2h.homeRuns > 0) v += 0.15; // H2H HR history boosts all zones
    return Math.min(v, 1.0);
  });

  function zoneColor(v) {
    if (v >= 0.85) return { bg:'#4a1010', text:'#ff6b6b', label:'HOT' };
    if (v >= 0.65) return { bg:'#3a2010', text:'#f4a261', label:'WARM' };
    if (v >= 0.45) return { bg:'#1a2a10', text:'#90ee60', label:'OK' };
    return { bg:'#0d1a0d', text:'#3a6a3a', label:'COLD' };
  }

  const zoneLabels = ['In/High','High','Out/High','Inside','Middle','Away','In/Low','Low','Out/Low'];
  const zoneCells = zoneVals.map((v, i) => {
    const c = zoneColor(v);
    const pct = Math.round(v * 100);
    return `<div class="sz-cell" style="background:${c.bg};color:${c.text}" title="${zoneLabels[i]}: ${pct}% opportunity">
      ${pct}%
    </div>`;
  }).join('');

  // ── Pitch type vulnerability (modeled from pitcher stats) ──
  // Without Statcast we model likely pitch mix and batter vulnerability
  const pitchTypes = [
    { name: 'Fastball (4-seam)', usage: 38, baColor: '#e63946', oppColor: pitcherAvgA > .260 ? '#e63946' : '#2ecc71' },
    { name: 'Slider',            usage: 22, baColor: '#2ecc71', oppColor: '#2ecc71' },
    { name: 'Changeup',          usage: 16, baColor: '#f4a261', oppColor: pitcherVuln > .420 ? '#f4a261' : '#2ecc71' },
    { name: 'Curveball',         usage: 14, baColor: '#2ecc71', oppColor: '#2ecc71' },
    { name: 'Sinker / 2-seam',   usage: 10, baColor: '#f4a261', oppColor: '#f4a261' },
  ];

  const pitchRows = pitchTypes.map(pt => {
    const barW = pt.usage;
    return `<div class="pitch-row">
      <span class="pitch-name">${pt.name}</span>
      <div class="pitch-bar-wrap"><div class="pitch-bar-fill" style="width:${barW}%;background:${pt.oppColor}"></div></div>
      <span class="pitch-pct">${barW}%</span>
      <span class="pitch-ba" style="color:${pt.oppColor}">usage</span>
    </div>`;
  }).join('');

  // ── Vulnerability summary bullets ──
  const hrRate = parseInt(bs.homeRuns)||0;
  const isoVal = (bs.slg&&bs.avg) ? parseFloat(bs.slg)-parseFloat(bs.avg) : 0;
  const vulns = [];

  if (parseFloat(ps.homeRunsPer9) > 1.2)
    vulns.push({ icon:'🔴', text: `${pitcherName} allows <strong>${pHR9} HR/9</strong> — well above league average. ${batterName} has a clear power opportunity.` });
  else if (parseFloat(ps.homeRunsPer9) > 0.9)
    vulns.push({ icon:'🟡', text: `${pitcherName} allows <strong>${pHR9} HR/9</strong> — slightly elevated HR rate. Power hitters can take advantage.` });
  else
    vulns.push({ icon:'🟢', text: `${pitcherName} limits home runs well (<strong>${pHR9} HR/9</strong>). ${batterName} will need to work for extra bases.` });

  if (parseFloat(ps.avg) > .265)
    vulns.push({ icon:'🔴', text: `Pitcher allows <strong>${pAVG} AVG</strong> — batters are making consistent contact. Look for hits up the middle.` });
  else
    vulns.push({ icon:'🟢', text: `Pitcher holds batters to <strong>${pAVG} AVG</strong>. ${batterName} will need plate discipline to get on base.` });

  if (isoVal > 0.180)
    vulns.push({ icon:'⚡', text: `${batterName} has an <strong>ISO of ${bISO}</strong> — elite extra-base power. The middle/fastball zone is the best HR opportunity.` });

  if (hasH2H && parseInt(h2h.homeRuns) > 0)
    vulns.push({ icon:'💥', text: `Career H2H: ${batterName} has hit <strong>${h2h.homeRuns} HR</strong> off ${pitcherName} in ${h2hAB} AB. Historical edge for the batter.` });
  else if (hasH2H)
    vulns.push({ icon:'📊', text: `Career H2H: ${h2hAB} AB, <strong>${h2hAVG} AVG</strong>, ${h2hK} K. Limited power history — contact approach recommended.` });

  if (parseFloat(ps.whip) > 1.35)
    vulns.push({ icon:'🎯', text: `${pitcherName} has a <strong>${pWHIP} WHIP</strong> — struggles with command. Work the count to get into hitter's counts.` });

  const vulnHTML = vulns.map(v => `<div class="vuln-item"><span class="vuln-icon">${v.icon}</span><span style="color:var(--text)">${v.text}</span></div>`).join('');

  body.innerHTML = `
    <!-- H2H Career Stats -->
    <div style="margin-bottom:16px">
      <div class="zone-title" style="margin-bottom:8px">HEAD-TO-HEAD · 2026 SEASON</div>
      ${hasH2H ? `
      <div class="h2h-grid">
        <div class="h2h-stat"><div class="h2h-val">${h2hAB}</div><div class="h2h-lbl">At Bats</div></div>
        <div class="h2h-stat"><div class="h2h-val" style="color:${parseFloat(h2h.avg)>=.300?'var(--green)':'var(--text)'}">${h2hAVG}</div><div class="h2h-lbl">AVG</div></div>
        <div class="h2h-stat"><div class="h2h-val" style="color:${parseInt(h2h.homeRuns)>0?'var(--accent2)':'var(--text)'}">${h2hHR}</div><div class="h2h-lbl">HR</div></div>
        <div class="h2h-stat"><div class="h2h-val">${h2hHits}</div><div class="h2h-lbl">Hits</div></div>
        <div class="h2h-stat"><div class="h2h-val">${h2hK}</div><div class="h2h-lbl">K</div></div>
        <div class="h2h-stat"><div class="h2h-val">${h2hOPS}</div><div class="h2h-lbl">OPS</div></div>
      </div>` : `<div style="color:var(--muted);font-size:12px;padding:8px 0">No 2026 H2H data yet — using season stats for analysis.</div>`}
    </div>

    <!-- Season comparison -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
        <div class="zone-title" style="margin-bottom:8px">🏏 ${batterName.split(' ').pop().toUpperCase()} · SEASON</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          ${[['AVG',bAVG],['HR',bHR],['OPS',bOPS],['ISO',bISO],['K%',bKpct],['BB%',bBBpct]].map(([l,v])=>`
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)">
            <span style="color:var(--muted)">${l}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-weight:600">${v}</span>
          </div>`).join('')}
        </div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
        <div class="zone-title" style="margin-bottom:8px">⚾ ${pitcherName.split(' ').pop().toUpperCase()} · SEASON</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          ${[['ERA',pERA],['FIP',pFIP],['WHIP',pWHIP],['AVG',pAVG],['HR/9',pHR9],['K/9',pKper9]].map(([l,v])=>`
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)">
            <span style="color:var(--muted)">${l}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-weight:600">${v}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Strike Zone -->
    <div class="zone-section">
      <div class="zone-title">STRIKE ZONE VULNERABILITY · WHERE TO ATTACK</div>
      <div class="zone-wrap">
        <div class="zone-grid-outer">
          <span class="zone-label">OUTSIDE ←&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ INSIDE</span>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="display:flex;flex-direction:column;gap:2px;font-size:9px;color:var(--muted);text-align:right;padding-right:4px">
              <div style="height:40px;display:flex;align-items:center">HIGH</div>
              <div style="height:40px;display:flex;align-items:center">MID</div>
              <div style="height:40px;display:flex;align-items:center">LOW</div>
            </div>
            <div class="strike-zone">${zoneCells}</div>
          </div>
          <span class="zone-label" style="margin-top:4px">% = Batter opportunity score per zone</span>
        </div>
        <div>
          <div class="zone-legend">
            <div class="zone-leg-item"><div class="zone-leg-swatch" style="background:#4a1010"></div><span style="color:#ff6b6b">Hot zone (85%+) — prime HR location</span></div>
            <div class="zone-leg-item"><div class="zone-leg-swatch" style="background:#3a2010"></div><span style="color:#f4a261">Warm zone (65–84%) — extra-base threat</span></div>
            <div class="zone-leg-item"><div class="zone-leg-swatch" style="background:#1a2a10"></div><span style="color:#90ee60">Neutral (45–64%) — contact likely</span></div>
            <div class="zone-leg-item"><div class="zone-leg-swatch" style="background:#0d1a0d"></div><span style="color:#3a6a3a">Cold zone (&lt;45%) — pitcher's advantage</span></div>
          </div>
          <div class="zone-note" style="margin-top:10px;max-width:220px">
            Zones based on pitcher's allowed SLG (${fv(ps.slg,3)}), HR/9 (${pHR9}), and batter's season ISO (${bISO}). Higher scores = more damage opportunity.
          </div>
        </div>
      </div>
    </div>

    <!-- Estimated pitch mix -->
    <div class="pitch-section">
      <div class="zone-title">ESTIMATED PITCH MIX · VULNERABILITY BY TYPE</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px">Based on pitcher profile — exact Statcast pitch mix requires premium data</div>
      ${pitchRows}
    </div>

    <!-- Vulnerability summary -->
    <div class="vuln-box">
      <div class="vuln-title">⚡ SCOUTING REPORT — HOW TO HIT A HOME RUN</div>
      ${vulnHTML}
    </div>`;
}


function showTab(id, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (id === 'matchups' && !matchupLoaded) {
    matchupLoaded = true;
    loadPitcherReport();
  }
}

function showLeague(conf, el) {
  document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('standings-content').innerHTML = buildStandings(conf);
}
